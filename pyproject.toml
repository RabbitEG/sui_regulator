[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sui-regulator"
version = "0.4.0"
description = "Durable task control, replaceable AI workers, independent experiment jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
yan = "sui_regulator.cli:main"
sui-regulator = "sui_regulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/licenses/*.txt"]

[tool.setuptools.package-data]
"sui_regulator" = ["static/*"]
"sui_regulator.failures" = ["patterns/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
