<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
  <title>Yan Console · 司岁台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/console.css"><script src="/assets/console.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到内容</a>
  <aside class="sidebar">
    <a class="brand" href="#/overview" aria-label="Yan Console 首页"><img src="/favicon.svg" alt="" width="36" height="36"><span>司岁台<small>YAN CONSOLE</small></span></a>
    <div class="workspace"><span class="workspace-icon">Y</span><div>本地工作区<small>Local control plane</small></div><span class="local-tag">LOCAL</span></div>
    <div class="nav-caption">WORKSPACE</div>
    <nav aria-label="主导航">
      <a href="#/overview" data-nav="overview" aria-label="总览 Overview" title="总览 Overview"><span data-icon="overview"></span><span>总览<small>Overview</small></span></a>
      <a href="#/sessions" data-nav="sessions" aria-label="Sui Proxy 代理会话" title="Sui Proxy 代理会话"><span data-icon="sessions"></span><span>代理会话<small>Proxies</small></span><b id="nav-sessions">—</b></a>
      <a href="#/tasks" data-nav="tasks" aria-label="任务 Tasks" title="任务 Tasks"><span data-icon="tasks"></span><span>任务<small>Tasks</small></span><b id="nav-tasks">—</b></a>
      <a href="#/incidents" data-nav="incidents" aria-label="故障 Incidents" title="故障 Incidents"><span data-icon="incidents"></span><span>故障<small>Incidents</small></span><b id="nav-incidents">—</b></a>
    </nav>
    <div class="sidebar-bottom"><div class="side-health"><span class="dot" id="side-dot"></span><span id="side-state">等待连接</span></div><p>Task 持久 · Proxy 可替换</p><div class="sidebar-version">SUI REGULATOR <span>v0.4</span></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb">Yan <span>/</span> <strong id="breadcrumb">工作台</strong></div><div class="top-actions"><span id="controller-badge" class="badge neutral" role="status">连接中</span><button class="icon-button" id="receipt-toggle" aria-label="查看命令回执"><span data-icon="receipt"></span><span>回执 <b id="receipt-count">0</b></span></button></div></header>
    <div class="content">
      <div class="refreshbar"><span id="updated-at">尚未读取账本</span><div class="refresh-controls"><label for="refresh-interval">自动刷新</label><select id="refresh-interval"><option value="2000">2 秒</option><option value="5000" selected>5 秒</option><option value="10000">10 秒</option><option value="30000">30 秒</option></select><button id="pause-refresh" class="text-button"><span data-icon="pause"></span><span>暂停</span></button><button id="refresh-now" class="text-button"><span data-icon="refresh"></span><span>立即刷新</span></button></div></div>
      <div id="connection-banner" class="notice warning" role="status" hidden></div>
      <main id="main" tabindex="-1" aria-busy="true"><div class="loading"><span class="loading-dot"></span>正在读取 Yan 账本…</div></main>
      <footer class="footer"><span><span class="dot blue"></span> 数据来自 Yan · AI 声明与运行观测分别记录</span><span>LOCALHOST ONLY</span></footer>
    </div>
  </div>
  <aside id="receipts" class="receipt-panel" aria-label="命令回执" hidden><div class="panel-head"><h2>命令回执</h2><button id="receipt-close" class="icon-button" aria-label="关闭回执">×</button></div><p class="panel-note">QUEUED 表示已接收，SUCCEEDED 表示指令定义的效果已应用。</p><div id="receipt-list"></div></aside>
  <dialog id="command-dialog"><form id="command-form"><div class="dialog-head"><div><div class="eyebrow">MANUAL INTERVENTION</div><h2 id="dialog-title"></h2></div><button type="button" class="icon-button" id="dialog-close" aria-label="关闭对话框">×</button></div><p id="dialog-description"></p><div id="dialog-target" class="target-box"></div><label id="instruction-label" for="instruction" hidden>追加指令</label><textarea id="instruction" rows="5" maxlength="16384" placeholder="明确下一步要核验的状态或分析内容…" hidden></textarea><label id="confirm-label" class="confirm-label" hidden><input type="checkbox" id="hold-confirm">确认停止当前 Sui Proxy，保留已启动的 Job</label><div id="dialog-error" class="notice danger" role="alert" hidden></div><div class="dialog-actions"><button type="button" class="button secondary" id="dialog-cancel">取消</button><button type="submit" class="button primary" id="dialog-submit">提交</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
