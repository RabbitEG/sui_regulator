[regulator]
tick_seconds = 0.2
lease_seconds = 15.0
heartbeat_seconds = 1.0
stall_seconds = 120.0
max_session_age = 1800.0
rotation_grace = 3.0
startup_grace = 5.0
restart_cooldown = 1.0
restart_window = 300.0
max_restarts = 3
max_proxies = 4
stale_seconds = 10.0
claude_binary = "claude"
claude_model = ""
claude_max_turns = 20
# Empty uses the versioned rules bundled with the wheel.
failure_registry = ""
# Optional operator-owned file listing approved command templates for workers.
# Must be mode 0700, owned by the deploy UID, never committed to Git.
